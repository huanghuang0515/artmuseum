<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QALISSO MUSEUM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Marcellus&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Roboto', sans-serif; overflow-x: hidden; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #EFD2B0; }
    ::-webkit-scrollbar-thumb { background: #5F2E13; border-radius: 3px; }

    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .page-fade { animation: pageFadeIn 0.5s ease forwards; }

    /* Nav */
    .nav-link {
      background: none; border: none; cursor: pointer;
      font-family: 'Roboto', sans-serif; font-size: 14px;
      color: #fff; letter-spacing: 0.07em; text-transform: uppercase;
      padding: 4px 0; border-bottom: 1px solid transparent;
      transition: border-color 0.2s, opacity 0.2s;
    }
    .nav-link:hover { border-bottom-color: rgba(255,255,255,0.55); opacity: 1 !important; }
    .nav-link.active { border-bottom-color: rgba(255,255,255,0.75); }

    /* Glass orb */
    .glass-orb {
      position: absolute;
      border-radius: 50%;
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      background: radial-gradient(
        circle at 33% 33%,
        rgba(255,255,255,0.22) 0%,
        rgba(255,255,255,0.06) 55%,
        rgba(255,255,255,0.01) 100%
      );
      border: 1px solid rgba(255,255,255,0.32);
      box-shadow:
        inset 0 0 50px rgba(255,255,255,0.07),
        0 24px 70px rgba(0,0,0,0.12);
      pointer-events: none;
      z-index: 4;
      will-change: left, top;
    }

    /* Exhibition card image zoom */
    .exh-card { overflow: hidden; cursor: pointer; }
    .exh-card:hover .exh-img { transform: scale(1.05); }
    .exh-img { transition: transform 0.45s ease; }

    /* Card lift */
    .card-lift { transition: transform 0.3s ease; cursor: pointer; }
    .card-lift:hover { transform: translateY(-5px); }

    /* Form inputs */
    .mu-input {
      width: 100%; background: transparent; border: none;
      border-bottom: 1.5px solid rgba(95,46,19,0.35);
      padding: 12px 0; font-family: 'Roboto', sans-serif;
      font-weight: 300; font-size: 16px; color: #5F2E13;
      outline: none; transition: border-color 0.25s;
      resize: none;
    }
    .mu-input:focus { border-bottom-color: #5F2E13; }
    .mu-input::placeholder { color: rgba(95,46,19,0.45); }

    /* Section heading */
    .display-heading {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    /* Arrow link */
    .arrow-link {
      display: inline-flex; align-items: center; gap: 12px;
      cursor: pointer; background: none; border: none;
      font-family: 'Roboto', sans-serif; font-size: 15px;
      letter-spacing: 0.04em; color: #5F2E13; transition: gap 0.25s;
    }
    .arrow-link:hover { gap: 18px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Shared.jsx"></script>
  <script type="text/babel" src="Navbar.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="HomePage.jsx"></script>
  <script type="text/babel" src="ExhibitionsPage.jsx"></script>
  <script type="text/babel" src="CollectionsPage.jsx"></script>
  <script type="text/babel" src="EventsPage.jsx"></script>
  <script type="text/babel" src="VisitPage.jsx"></script>
  <script type="text/babel" src="ContactPage.jsx"></script>
  <script type="text/babel" src="TicketsPage.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
